<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StormSafe 3D Builder + Pricing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #08121d;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      width: 100%;
    }
    #root {
      height: 100vh;
      overflow: hidden;
    }
    .pricing-side {
      width: 400px;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      border-right: 1px solid #1e2d42;
      background: #08121d;
    }
    .builder-side {
      flex: 1;
      height: 100vh;
      overflow: hidden;
      background: #08121d;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Scrollbar styling */
    .pricing-side::-webkit-scrollbar {
      width: 8px;
    }
    .pricing-side::-webkit-scrollbar-track {
      background: #08121d;
    }
    .pricing-side::-webkit-scrollbar-thumb {
      background: #2a3d55;
      border-radius: 4px;
    }
    .pricing-side::-webkit-scrollbar-thumb:hover {
      background: #3a4d65;
    }
  </style>
</head>
<body>
  <!-- Pricing Program (left) -->
  <div class="pricing-side">
    <iframe src="quote-builder.html" title="Pricing Program"></iframe>
  </div>
  <!-- 3D Builder (right) — React mounts here -->
  <div id="root" class="builder-side"></div>

  <!-- React app mounts here -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
